# Stock-image reference profile; not the active optimized deployment.
# Current profiles and measurements: experiments/2026-09-20-amd-optimized/.
# vLLM precedence is CLI > YAML > defaults. To disable a boolean, use the
# negative flag with true (for example no-enable-log-requests: true).

# First alias is the response model name; retain aliases used by clients.
served-model-name:
  - FW-Kimi-K3
  - kimi-k3
trust-remote-code: true

tensor-parallel-size: 8
enable-expert-parallel: true

load-format: fastsafetensors

# Context includes input and generated output. These reference limits are not
# measured sustainable concurrency; qualify changes with the intended workload.
max-model-len: 262144
max-num-seqs: 96
max-num-batched-tokens: 16384
# Required for the priority field attached by the gateway.
scheduling-policy: priority
long-prefill-token-threshold: 16384

# Available working memory varies by image, graph mode and request shape.
gpu-memory-utilization: 0.92

# Let the hybrid cache manager choose compatible attention/KDA block sizes.
enable-prefix-caching: true
prefix-match-unit: 128

# Return cached-token accounting to upstream gateways.
enable-prompt-tokens-details: true

compilation-config:
  cudagraph_mode: FULL_DECODE_ONLY
  custom_ops:
    - "+fused_rms_norm_gated"

reasoning-parser: kimi_k3
tool-call-parser: kimi_k3
enable-auto-tool-choice: true

no-enable-log-requests: true

host: 127.0.0.1
port: 8001
