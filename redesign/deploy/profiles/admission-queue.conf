Environment=K3_ADMISSION_MAX_WAITERS=32
Environment=K3_ADMISSION_MAX_PER_CUSTOMER=32
Environment=K3_ADMISSION_QUEUED_TOKENS=2097152
Environment=K3_ADMISSION_QUEUED_BYTES=67108864
Environment=K3_LONG_OUTPUT_BURST_KV=0.55
Environment=K3_LONG_OUTPUT_BURST_RUNNING=16
Environment=K3_LONG_OUTPUT_BURST_PROMPT=32768
Environment=K3_LONG_OUTPUT_BASE_TOKEN_BUDGET=12288
Environment=K3_LONG_OUTPUT_BURST_TOKEN_BUDGET=49152
Environment=K3_ENGINE_QUEUE_TOLERANCE=2
Environment=K3_ADAPTIVE_BORROW_MAX=32
