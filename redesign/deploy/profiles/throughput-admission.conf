# Install as k3-gateway.service.d/95-throughput-admission.conf.
# One adaptive execution pool, with an independent bounded burst queue.
# Rest at the measured 16-request throughput/latency crossover. A real gateway
# queue may expand to 24 while decode remains faster than 40 ms; sustained
# 80 ms decode latency drains toward the eight-request pressure floor.
[Service]
Environment=K3_THROUGHPUT_FIRST=1
Environment=K3_ADMISSION_WAIT_SECONDS=60
Environment=K3_ADMISSION_MAX_WAITERS=128
Environment=K3_ADMISSION_MAX_PER_CUSTOMER=128
Environment=K3_ADMISSION_QUEUED_TOKENS=67108864
Environment=K3_ADMISSION_QUEUED_BYTES=1073741824
Environment=K3_ADMISSION_FAIRNESS_AGE_SECONDS=5
Environment=K3_ADAPTIVE_BORROW_MAX=24
Environment=K3_ADAPTIVE_MIN_EXECUTION=8
Environment=K3_ADAPTIVE_INITIAL_EXECUTION=16
Environment=K3_ADAPTIVE_BORROW_KV=0.88
Environment=K3_ADAPTIVE_GREEN_ITL=0.04
Environment=K3_ADAPTIVE_BORROW_ITL=0.08
Environment=K3_PROJECTED_KV_LIMIT=0.92
