#cloud-config
# First-boot config for a fresh MI355X spot droplet in mem1.
# Pass via: doctl compute droplet create --user-data-file cloud-init.yaml
# NOTE: DO's API has NO spot field (verified: 0 occurrences of "spot" across
# 2,968 files in digitalocean/openapi). The droplet itself must be created in
# the Control Panel. Everything AFTER creation is automated by this file.
package_update: true
packages: [jq, zstd, python3.12-venv]

write_files:
  - path: /etc/sysctl.d/99-vllm.conf
    content: |
      net.core.rmem_max = 268435456
      net.core.wmem_max = 268435456
      net.ipv4.tcp_rmem = 4096 87380 268435456
      net.ipv4.tcp_wmem = 4096 65536 268435456
      net.core.default_qdisc = fq_codel
      net.ipv4.tcp_congestion_control = cubic

  - path: /usr/local/bin/k3-bootstrap.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      # 1. scratch, on the BOOT DISK. Everything the box needs to serve lives
      # here, so a droplet snapshot is self-contained: restoring one brings the
      # 1.5 TB of weights with it and the box serves in minutes instead of
      # re-downloading. Do not mount the DOSCRATCH volume here - it would hide
      # the weights. Attach it at /mnt/bulk if you want the extra space.
      mkdir -p /scratch/hf /scratch/results /scratch/deploy

      # 2. weights. Re-downloading IS optimal: measured 2.23 GB/s (~700s).
      # GPU droplets have no documented INBOUND cap and ingress is unmetered,
      # while egress is capped at 10 Gbps AND billed - so every "cache it
      # somewhere" scheme pays >=1249s outbound to build a cache that at best
      # ties a free 700s download.
      export HF_HOME=/scratch/hf
      export HF_XET_HIGH_PERFORMANCE=1   # raises max download concurrency 64 -> 124
      if [ ! -d /scratch/hf/hub/models--moonshotai--Kimi-K3 ]; then
        python3 -m venv /opt/hfv
        /opt/hfv/bin/pip install -q -U "huggingface_hub[cli]"
        /opt/hfv/bin/hf download moonshotai/Kimi-K3
      fi

      # 3. serving config + supervision
      install -m644 /scratch/deploy/config.yaml /scratch/hf/config.yaml
      install -m644 /scratch/deploy/k3.service /etc/systemd/system/k3.service
      systemctl daemon-reload && systemctl enable --now k3.service

runcmd:
  - [sysctl, --system]
  - [/usr/local/bin/k3-bootstrap.sh]
