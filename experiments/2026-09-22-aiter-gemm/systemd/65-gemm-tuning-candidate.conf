[Service]
# Trial-only override. Removing this file restores the qualified 60-amd profile.
ExecStart=
ExecStart=/usr/bin/docker run --rm --name k3 \
  --device /dev/kfd --device /dev/dri --group-add video \
  --ipc host --network host --security-opt seccomp=unconfined --cap-add SYS_PTRACE \
  --shm-size 64g --log-opt max-size=100m --log-opt max-file=5 \
  -v /scratch/hf:/hf -v /scratch/results:/results \
  -v /scratch/deploy-state/amd-optimized:/trial:ro \
  -v /scratch/deploy-state/amd-optimized/cache:/root/.cache \
  -v /root/cflow-gpu/redesign/deploy/vllm_patches/kimi_k3_reasoning_parser.py:/usr/local/lib/python3.12/dist-packages/vllm/reasoning/kimi_k3_reasoning_parser.py:ro \
  -v /root/cflow-gpu/redesign/deploy/vllm_patches/protocol.py:/usr/local/lib/python3.12/dist-packages/vllm/entrypoints/openai/engine/protocol.py:ro \
  -v /root/cflow-gpu/redesign/deploy/vllm_patches/chat_serving.py:/usr/local/lib/python3.12/dist-packages/vllm/entrypoints/openai/chat_completion/serving.py:ro \
  --env-file /scratch/deploy-state/amd-optimized/gemm/optimized-gemm-candidate.env \
  --entrypoint vllm \
  cflowx/kimi-k3-aiter-gemm:5337bf2c \
  serve /hf/hub/models--moonshotai--Kimi-K3/snapshots/f831ab66814297da540d832a5235f8e904f29d06 --config /trial/config-base.yaml
