# Selected AMD optimized aggregated profile, adapted to LiteLLM. See RESULTS.md.
# Provenance and explicit deviations: README.md. Supply the local target snapshot
# as the positional argument to `vllm serve`; do not merge with the live config.
served-model-name:
  - FW-Kimi-K3
  - kimi-k3
  - moonshotai/Kimi-K3
host: 127.0.0.1
port: 8001
trust-remote-code: true

tensor-parallel-size: 8
# AMD omits EP (default false). Positive negative flag makes that intent explicit
# despite the YAML-to-argv parser dropping boolean false values.
no-enable-expert-parallel: true
load-format: auto
mm-encoder-tp-mode: data
kv-cache-dtype: auto
enable-prefix-caching: true
max-num-seqs: 64
max-num-batched-tokens: 4096
gpu-memory-utilization: 0.88

# Local external contract: AMD uses 1048576; retain our 262144-token window.
max-model-len: 262144
# Local gateway always sends priority; AMD's manifest leaves the policy default.
scheduling-policy: priority
# Preserve cached-token accounting used by the gateway.
enable-prompt-tokens-details: true

reasoning-parser: kimi_k3
tool-call-parser: kimi_k3
enable-auto-tool-choice: true
no-enable-log-requests: true
