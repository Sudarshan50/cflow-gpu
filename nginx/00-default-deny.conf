# Requests that match no server_name (scanners hitting the bare IP) are
# dropped instead of falling through to the cflox.store block.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
